<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Free All-in-One Calculator with math, scientific, financial, health, date and unit conversion tools.">
<title>All-in-One Calculator | Free Online Calculators</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--txt:#172033;--muted:#697386;--pri:#4f46e5;--pri2:#4338ca;--line:#e5e7eb;--soft:#eef0ff;--danger:#dc2626;--shadow:0 12px 32px #11182712}
.dark{--bg:#0d1220;--card:#171d2d;--txt:#f7f8fc;--muted:#a9b1c2;--line:#2b3447;--soft:#242b45;--shadow:0 12px 32px #0005}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,Arial,sans-serif}button,input,select{font:inherit}
.wrap{width:min(1150px,92%);margin:auto}header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:1.25rem;font-weight:800}.logo b{color:var(--pri)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:11px;padding:10px 14px;cursor:pointer}.btn.primary{background:var(--pri);color:#fff;border-color:var(--pri)}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}
.hero{text-align:center;padding:55px 0 30px}.hero h1{font-size:clamp(2.1rem,5vw,4rem);line-height:1.05;margin:0 0 14px}.hero p{color:var(--muted);font-size:1.08rem}.search{max-width:720px;margin:25px auto}.search input{width:100%;padding:17px 20px;border:1px solid var(--line);border-radius:17px;background:var(--card);color:var(--txt);box-shadow:var(--shadow);outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;padding:15px 0 55px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;cursor:pointer;box-shadow:var(--shadow);transition:.18s}.card:hover{transform:translateY(-4px);border-color:var(--pri)}.icon{font-size:1.6rem}.card h3{margin:9px 0 5px;font-size:1rem}.card p{margin:0;color:var(--muted);font-size:.85rem}
.app{max-width:900px;margin:20px auto 70px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.apphead{display:flex;justify-content:space-between;gap:12px;align-items:center}.apphead h2{margin:0}.panel{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}.field label{display:block;color:var(--muted);font-size:.86rem;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--txt)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.result{margin-top:18px;padding:18px;border-radius:15px;background:var(--soft);line-height:1.8}.result .big{font-size:1.45rem;font-weight:800}.error{color:var(--danger);font-weight:600}
.display{margin:18px 0;background:var(--soft);padding:20px;border-radius:16px;text-align:right;font-size:2rem;min-height:76px;overflow:auto}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.keys button{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--txt);cursor:pointer}.keys .op{background:var(--soft);color:var(--pri);font-weight:700}.keys .eq{background:var(--pri);color:#fff}
.history{margin-top:22px;border-top:1px solid var(--line);padding-top:15px}.hist{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.info{margin-top:25px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.92rem}.hide{display:none}footer{text-align:center;color:var(--muted);padding:35px;border-top:1px solid var(--line)}
@media(max-width:650px){.panel{grid-template-columns:1fr}.app{padding:16px}.apphead{align-items:flex-start;flex-direction:column}.hero{padding-top:40px}.keys button{padding:14px}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="logo">All-in-One <b>Calculator</b></div><button class="btn" id="theme">🌙</button></div></header>
<main class="wrap">
<section class="hero"><h1>Calculate anything.</h1><p>Math, finance, health, dates and conversions — all in one place.</p>
<div class="search"><input id="search" placeholder="Search calculator or try: 20% of 500"></div></section>
<section id="cards" class="grid"></section>
<section id="app" class="app hide"><div class="apphead"><h2 id="title"></h2><button class="btn" onclick="closeApp()">← All calculators</button></div><div id="body"></div></section>
</main>
<footer>All-in-One Calculator • Free online calculation tools</footer>
<script>
const defs=[
["Basic Calculator","basic","➗","Everyday arithmetic"],["Scientific Calculator","scientific","∑","Advanced math"],["Percentage Calculator","percent","%","Percent calculations"],["Fraction Calculator","fraction","½","Fraction operations"],["Ratio Calculator","ratio","⚖️","Simplify ratios"],["Average Calculator","average","📊","Mean, median and sum"],["Age Calculator","age","🎂","Exact age"],["Date Calculator","date","📅","Date difference"],["Time Calculator","time","⏱️","Time duration"],["BMI Calculator","bmi","⚕️","Body mass index"],["EMI Calculator","emi","🏦","Loan EMI"],["Loan Calculator","loan","💳","Loan repayment"],["Compound Interest","compound","📈","Compound growth"],["Simple Interest","simple","💰","Simple interest"],["Discount Calculator","discount","🏷️","Sale price"],["GST Calculator","gst","🧾","GST add/remove"],["Salary Calculator","salary","💼","Salary breakdown"],["Tax Calculator","tax","🧮","Simple tax estimate"],["Profit & Loss","profit","📦","Business margin"],["Currency Calculator","currency","💱","Currency conversion"],["Length Converter","length","📏","Length units"],["Weight Converter","weight","⚖️","Weight units"],["Temperature Converter","temperature","🌡️","Temperature"],["Area Converter","area","⬛","Area units"],["Volume Converter","volume","🧪","Volume units"],["Speed Converter","speed","🚗","Speed units"],["Storage Converter","storage","💾","Digital storage"],["Time Zone Calculator","timezone","🌍","Time-zone offsets"],["Number Base Converter","base","🔢","Binary/decimal/hex"],["Random Number Generator","random","🎲","Random numbers"]];
const cards=document.getElementById("cards");
defs.forEach(d=>cards.insertAdjacentHTML("beforeend",`<article class="card" data-key="${d[1]}"><div class="icon">${d[2]}</div><h3>${d[0]}</h3><p>${d[3]}</p></article>`));
cards.onclick=e=>{let c=e.target.closest(".card");if(c)open(c.dataset.key)};
search.oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll(".card").forEach(c=>c.style.display=!q||c.innerText.toLowerCase().includes(q)?"block":"none");let m=q.match(/^([\d.]+)%\s+of\s+([\d.]+)$/);if(m)open("percent",m[1],m[2])};
theme.onclick=()=>{document.body.classList.toggle("dark");theme.textContent=document.body.classList.contains("dark")?"☀️":"🌙";localStorage.theme=document.body.classList.contains("dark")?"dark":"light"};if(localStorage.theme==="dark")theme.click();
const $=id=>document.getElementById(id), fmt=n=>Number(n).toLocaleString("en-IN",{maximumFractionDigits:6}), money=n=>"₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});
function closeApp(){$("app").classList.add("hide");scrollTo({top:0,behavior:"smooth"})}
function open(k,a,b){$("app").classList.remove("hide");$("title").textContent=defs.find(x=>x[1]===k)[0];$("body").innerHTML=ui(k);if(a){$("p1").value=a;$("p2").value=b;$("run").click()}$("app").scrollIntoView({behavior:"smooth",block:"start"})}
function ui(k){
if(k==="basic"||k==="scientific")return basic(k==="scientific");
if(k==="percent")return fields("Percentage","Percent","Number","Calculate percentage",()=>show(`<b class=big>${fmt(+p1.value*+p2.value/100)}</b><br>${fmt(+p1.value)}% of ${fmt(+p2.value)}`));
if(k==="fraction")return fields4("First numerator","First denominator","Second numerator","Second denominator","Add fractions",()=>{let n=+p1.value*+p4.value+ +p3.value*+p2.value,d=+p2.value*+p4.value;show(`<b class=big>${n}/${d}</b>`);});
if(k==="ratio")return fields("A","A","B","Simplify ratio",()=>{let a=+p1.value,b=+p2.value,g=gcd(Math.abs(a),Math.abs(b));show(`<b class=big>${a/g}:${b/g}</b>`);});
if(k==="average")return one("Numbers, comma separated","10,20,30","Calculate average",()=>{let a=p1.value.split(",").map(Number).filter(Number.isFinite),s=a.reduce((x,y)=>x+y,0);show(`<b class=big>${fmt(s/a.length)}</b><br>Sum: ${fmt(s)}<br>Count: ${a.length}`)});
if(k==="age")return `<div class=field><label>Date of birth</label><input id=dob type=date></div><div class=actions><button class="btn primary" onclick=age()>Calculate age</button></div><div id=result></div>`;
if(k==="bmi")return fields("Height (cm)","170","Weight (kg)","70","Calculate BMI",()=>{let v=+p2.value/(+p1.value/100)**2,c=v<18.5?"Underweight":v<25?"Normal":v<30?"Overweight":"Obesity";show(`<b class=big>${fmt(v)}</b><br>${c}`)});
if(k==="emi"||k==="loan")return loan();
if(k==="compound")return compound();
if(k==="simple")return fields3("Principal","Rate (%)","Time (years)","Calculate",()=>{let i=+p1.value*+p2.value/100*+p3.value;show(`<b class=big>${fmt(i)}</b><br>Final amount: ${fmt(+p1.value+i)}`)});
if(k==="discount")return fields("Original price","1000","Discount (%)","20","Calculate",()=>{let d=+p1.value*+p2.value/100;show(`<b class=big>${money(+p1.value-d)}</b><br>Discount: ${money(d)}`)});
if(k==="gst")return `<div class=panel><div class=field><label>Amount</label><input id=ga type=number value=1000></div><div class=field><label>GST %</label><input id=gr type=number value=18></div></div><div class=actions><button class="btn primary" onclick=gst(false)>Add GST</button><button class=btn onclick=gst(true)>Remove GST</button></div><div id=result></div>`;
if(k==="profit")return fields("Cost price","800","Selling price","1000","Calculate",()=>{let p=+p2.value-+p1.value,pc=p/+p1.value*100;show(`<b class=big>${p>=0?"Profit":"Loss"}: ${money(Math.abs(p))}</b><br>${fmt(Math.abs(pc))}%`)});
if(k==="salary")return fields3("Annual salary","Other deductions","Tax %","Calculate",()=>{let gross=+p1.value,ded=+p2.value,t=+p3.value/100*gross,net=gross-t-ded;show(`<b class=big>${money(net/12)}</b> estimated monthly take-home<br>Annual net: ${money(net)}`)});
if(k==="tax")return fields("Annual income","600000","Tax rate (%)","10","Estimate",()=>{let t=+p1.value*+p2.value/100;show(`<b class=big>${money(t)}</b><br>After-tax income: ${money(+p1.value-t)}`)});
if(k==="currency")return fields("Amount","100","Rate (target per 1 source)","83","Convert",()=>show(`<b class=big>${fmt(+p1.value*+p2.value)}</b>`));
if(["length","weight","temperature","area","volume","speed","storage"].includes(k))return converter(k);
if(k==="date")return `<div class=panel><div class=field><label>Start date</label><input id=ds type=date></div><div class=field><label>End date</label><input id=de type=date></div></div><div class=actions><button class="btn primary" onclick=dateDiff()>Calculate difference</button></div><div id=result></div>`;
if(k==="time")return `<div class=panel><div class=field><label>Start</label><input id=ts type=time></div><div class=field><label>End</label><input id=te type=time></div></div><div class=actions><button class="btn primary" onclick=timeDiff()>Calculate duration</button></div><div id=result></div>`;
if(k==="base")return fields("Number","1010","From base","2","Convert",()=>{let n=parseInt(p1.value,+p2.value),to=prompt("Enter target base: 2, 8, 10 or 16","10");if([2,8,10,16].includes(+to))show(`<b class=big>${n.toString(+to)}</b>`)});
if(k==="random")return fields("Minimum","1","Maximum","100","Generate",()=>show(`<b class=big>${Math.floor(Math.random()*(+p2.value-+p1.value+1)+ +p1.value)}</b>`));
if(k==="timezone")return fields("Time in source zone (hour)","12","Offset difference (hours)","5.5","Convert",()=>show(`<b class=big>${fmt((+p1.value+ +p2.value+24)%24)}:00</b>`));
return `<div class=result>Calculator ready.</div>`;
}
function fields(l1,v1,l2,v2,act,fn){return `<div class=panel><div class=field><label>${l1}</label><input id=p1 type=number value="${v1}"></div><div class=field><label>${l2}</label><input id=p2 type=number value="${v2}"></div></div><div class=actions><button id=run class="btn primary" onclick=(${fn})()>${act}</button></div><div id=result></div>`}
function fields3(a,b,c,act,fn){return `<div class=panel><div class=field><label>${a}</label><input id=p1 type=number></div><div class=field><label>${b}</label><input id=p2 type=number></div><div class=field><label>${c}</label><input id=p3 type=number></div></div><div class=actions><button id=run class="btn primary" onclick=(${fn})()>${act}</button></div><div id=result></div>`}
function fields4(a,b,c,d,act,fn){return `<div class=panel><div class=field><label>${a}</label><input id=p1 type=number></div><div class=field><label>${b}</label><input id=p2 type=number></div><div class=field><label>${c}</label><input id=p3 type=number></div><div class=field><label>${d}</label><input id=p4 type=number></div></div><div class=actions><button id=run class="btn primary" onclick=(${fn})()>${act}</button></div><div id=result></div>`}
function one(l,v,act,fn){return `<div class=field><label>${l}</label><input id=p1 value="${v}"></div><div class=actions><button id=run class="btn primary" onclick=(${fn})()>${act}</button></div><div id=result></div>`}
function loan(){return `<div class=panel><div class=field><label>Loan amount (₹)</label><input id=la type=number value=500000></div><div class=field><label>Annual interest (%)</label><input id=lr type=number value=8.5></div><div class=field><label>Tenure (years)</label><input id=lt type=number value=5></div></div><div class=actions><button class="btn primary" onclick=calcLoan()>Calculate EMI</button></div><div id=result></div>`}
function calcLoan(){let P=+la.value,r=+lr.value/1200,n=+lt.value*12,emi=r?P*r*(1+r)**n/((1+r)**n-1):P/n;show(`<b class=big>${money(emi)}</b> / month<br>Total interest: ${money(emi*n-P)}<br>Total payment: ${money(emi*n)}`)}
function compound(){return fields4("Principal","Rate (%)","Years","Compounds/year","Calculate",()=>{let A=+p1.value*(1+(+p2.value/100)/+p4.value)**(+p4.value*+p3.value);show(`<b class=big>${fmt(A)}</b><br>Interest: ${fmt(A-+p1.value)}`)})}
function converter(k){let u={length:["meter","kilometer","mile","foot","inch","centimeter"],weight:["kilogram","gram","pound","ounce"],temperature:["celsius","fahrenheit","kelvin"],area:["square meter","square kilometer","square foot","acre"],volume:["liter","milliliter","gallon"],speed:["km/h","mph","m/s"],storage:["byte","KB","MB","GB","TB"]}[k];return `<div class=panel><div class=field><label>Value</label><input id=cv type=number value=1></div><div class=field><label>From</label><select id=cf>${u.map(x=>`<option>${x}</option>`).join("")}</select></div><div class=field><label>To</label><select id=ct>${u.map(x=>`<option>${x}</option>`).join("")}</select></div></div><div class=actions><button class="btn primary" onclick="convert('${k}')">Convert</button></div><div id=result></div>`}
function convert(k){let v=+cv.value,a=cf.value,b=ct.value,r;if(k==="temperature"){let c=a==="celsius"?v:a==="fahrenheit"?(v-32)*5/9:v-273.15;r=b==="celsius"?c:b==="fahrenheit"?c*9/5+32:c+273.15}else{let m={length:{meter:1,kilometer:.001,mile:.000621371,foot:3.28084,inch:39.3701,centimeter:100},weight:{kilogram:1,gram:1000,pound:2.20462,ounce:35.274},area:{"square meter":1,"square kilometer":1e-6,"square foot":10.7639,acre:.000247105},volume:{liter:1,milliliter:1000,gallon:.264172},speed:{"km/h":1,mph:.621371,"m/s":.277778},storage:{byte:1,KB:1/1024,MB:1/1048576,GB:1/1073741824,TB:1/1099511627776}}[k];r=v*m[b]/m[a]}show(`<b class=big>${fmt(r)} ${b}</b>`)}
function basic(sci){return `<div id=display class=display>0</div><div class=keys>${["C","⌫","(",")","7","8","9","÷","4","5","6","×","1","2","3","−","0",".","%","+"].map(x=>`<button onclick="press('${x}')" class="${"÷×−+%".includes(x)?"op":""}">${x}</button>`).join("")}<button class=eq onclick=equals()>=</button></div>${sci?`<div class=actions>${["sin","cos","tan","sqrt","log","ln","square"].map(x=>`<button class=btn onclick="scientific('${x}')">${x}</button>`).join("")}<button class=btn onclick="press('π')">π</button></div>`:""}<div class=history><b>Calculation history</b><div id=hist></div><button class=btn onclick="localStorage.removeItem('history');renderHist()">Clear</button></div>`}
let expr="";
function press(x){if(x==="C")expr="";else if(x==="⌫")expr=expr.slice(0,-1);else expr+=x==="×"?"*":x==="÷"?"/":x==="−"?"-":x;$("display").textContent=expr||"0"}
function equals(){try{let e=expr.replace(/π/g,Math.PI).replace(/%/g,"/100"),v=Function('"use strict";return '+e)();$("display").textContent=fmt(v);expr=String(v);let h=JSON.parse(localStorage.history||"[]");h.unshift(e+" = "+v);localStorage.history=JSON.stringify(h.slice(0,20));renderHist()}catch{$("display").textContent="Invalid"}}
function scientific(x){let v=Number(expr||0),r=x==="sqrt"?Math.sqrt(v):x==="square"?v*v:x==="log"?Math.log10(v):x==="ln"?Math.log(v):Math[x](v*Math.PI/180);expr=String(r);$("display").textContent=fmt(r)}
function renderHist(){let h=JSON.parse(localStorage.history||"[]");let el=$("hist");if(el)el.innerHTML=h.map(x=>`<div class=hist>${x}</div>`).join("")}
function show(x){$("result").innerHTML=`<div class=result>${x}<div class=actions><button class=btn onclick="navigator.clipboard?.writeText($('result').innerText)">Copy result</button></div></div>`}
function gcd(a,b){while(b)[a,b]=[b,a%b];return a||1}
function age(){let d=new Date(dob.value+"T00:00:00"),n=new Date();if(isNaN(d))return show("<span class=error>Choose a valid date.</span>");let y=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth(),day=n.getDate()-d.getDate();if(day<0){m--;day+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}show(`<b class=big>${y} years, ${m} months, ${day} days</b>`)}
function gst(remove){let a=+ga.value,r=+gr.value/100,total=remove?a/(1+r):a*(1+r),g=remove?a-total:a*r;show(`<b class=big>${money(total)}</b><br>GST: ${money(g)}<br>CGST: ${money(g/2)} • SGST: ${money(g/2)}`)}
function dateDiff(){let d=Math.abs(new Date(de.value)-new Date(ds.value))/86400000;show(`<b class=big>${d} days</b>`) }
function timeDiff(){let a=ts.valueAsNumber,b=te.valueAsNumber,d=(b-a)/60000;if(d<0)d+=1440;show(`<b class=big>${Math.floor(d/60)}h ${d%60}m</b>`)}
document.addEventListener("keydown",e=>{if($("app").classList.contains("hide"))return;if(["INPUT","SELECT"].includes(e.target.tagName))return;if(/[\d+\-*/().%]/.test(e.key))press(e.key);if(e.key==="Enter")equals();if(e.key==="Backspace")press("⌫")});
</script>
</body>
</html>
